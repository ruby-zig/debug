name: TruffleRuby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  truffleruby:
    runs-on: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'incus-ruby-zig-debug' }}"
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: truffleruby-head
        bundler-cache: true
    - name: Test installing the gem on TruffleRuby
      run: |
        bundle exec rake compile
        bundle exec rake build
        gem install pkg/debug-*.gem
